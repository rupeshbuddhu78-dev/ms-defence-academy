plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.msdefence.academy'
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '17' }
    defaultConfig { applicationId 'com.msdefence.academy'; minSdk 24; targetSdk flutter.targetSdkVersion; versionCode flutter.versionCode; versionName flutter.versionName }
    buildTypes {
        release {
            // Test build only: keep the optimized APK directly installable with the local debug key.
            signingConfig signingConfigs.debug
        }
    }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
flutter { source '../..' }
